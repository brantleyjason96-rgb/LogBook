# Build memory kept small: this also runs inside constrained containers.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx2048m
# The configuration cache trips over KSP2 in AGP 8.13; leave it off.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# The container has no Android SDK; CI and Android Studio do. Point
# sdk.dir at an SDK or export ANDROID_HOME when building locally.
