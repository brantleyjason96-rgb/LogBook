name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Core tests, app build and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Core unit tests (pure JVM)
        run: ./gradlew :core:test

      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: logbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Reference screenshots for Roborazzi are recorded on demand, compared
      # by eye against android/design/margin/screens/, and then committed.
      # ./gradlew :app:recordRoborazziDebug (run in /android) produces them.

  # Release signing is left to the user: supply keystore secrets and run
  # ./gradlew :app:assembleRelease with the signingConfig wired in locally.
